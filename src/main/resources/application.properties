spring.application.name=incident-desk
server.port=8081

# 현재 개발 서버는 이 컴퓨터에서만 접속하도록 제한
server.address=127.0.0.1

# 로컬 MySQL의 프로젝트 전용 DB에 앱 계정으로 접속
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/incident_desk
spring.datasource.username=incident_app

# 실제 비밀번호는 실행 터미널의 환경 변수에서 읽음
spring.datasource.password=${DB_PASSWORD}

# 실제 API 키도 환경 변수에서 읽음
# 미설정 시 빈 값이 전달되고 인증 설정에서 서버 시작을 차단
incident.ingestion.api-key=${INGESTION_API_KEY:}

# 테이블 생성·변경은 별도 SQL로 관리
spring.jpa.hibernate.ddl-auto=none

# HTTP 응답을 만드는 동안 DB 세션을 계속 유지하지 않음
spring.jpa.open-in-view=false